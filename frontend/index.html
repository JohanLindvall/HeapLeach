<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Stamp the theme before first paint, so a light-mode visitor never
      // sees a flash of the dark default while the bundle loads.
      (function () {
        try {
          var saved = localStorage.getItem('heapleach.theme');
          var dark = saved === 'dark' || (saved !== 'light' &&
            !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta name="description" content="Bulk downloader with live parallel transfer status." />
    <title>HeapLeach — bulk downloader</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%AC%87%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
