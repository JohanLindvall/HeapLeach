# Dependabot keeps the Go modules in backend/go.mod current. Every change
# merged to main that passes CI publishes a new latest image, so they arrive
# as one weekly pull request rather than one per module: fewer rollouts, and
# no go.sum conflicts between updates that move together. Pull requests get
# CI's checks without publishing anything.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    # Merging the update restarts the service under whatever it is
    # downloading, so it comes at a quiet hour rather than a random one.
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Stockholm
    groups:
      go-modules:
        patterns: ["*"]
    # The binding asks the native runtime for a version of its API, and
    # helpers/captcha/install.sh pins that runtime: they move together, by
    # hand. v1.36 asked the pinned 1.23.2 for an API it does not have, and
    # failed every platform's CAPTCHA tests.
    ignore:
      - dependency-name: github.com/yalue/onnxruntime_go
