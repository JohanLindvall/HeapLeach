name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dependabot's token-authenticated merge produces no push workflow, so its
  # follow-up dispatch supplies the CI run and image for that main commit.
  workflow_dispatch:

# PR checks may be superseded. Image publication has its own queue.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}

  image:
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
