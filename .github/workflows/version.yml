name: Update version

on:
  workflow_dispatch:
    inputs:
      version:
        description: New stable tag (vX.Y.Z); leave blank to bump the patch
        type: string
        required: false
        default: ''

concurrency:
  group: heapleach-version
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: read

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
            --json conclusion --jq 'any(.[]; .conclusion == "success")')" = true
      - name: Select and create the version tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag=$(bash .github/scripts/release-tag.sh "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID")
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
