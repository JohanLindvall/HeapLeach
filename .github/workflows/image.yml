name: Publish latest image

on:
  workflow_call:

# Keep publications in order; a late CI rerun must not roll latest back.
concurrency:
  group: heapleach-latest-image
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select the image version
        id: version
        run: |
          set -euo pipefail
          git fetch --quiet origin --tags '+refs/heads/main:refs/remotes/origin/main'
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer main commit exists; skipping latest publication.'
            exit 0
          fi
          printf 'version=%s\n' "$(bash .github/scripts/image-version.sh HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.version != ''
      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.version != ''
      - uses: docker/login-action@v4
        if: steps.version.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v6
        if: steps.version.outputs.version != ''
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/heapleach
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v7
        if: steps.version.outputs.version != ''
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=latest-image
          cache-to: type=gha,scope=latest-image,mode=max
