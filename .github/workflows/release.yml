name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build and publish (vX.Y.Z)
        type: string
        required: true

# Manual publications share a queue so retries cannot overlap asset uploads.
concurrency:
  group: heapleach-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        name: Resolve the requested release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          printf 'tag=%s\nsha=%s\n' "$TAG" "$sha" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  archives:
    needs: prepare
    uses: ./.github/workflows/archives.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, checks, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: archives-${{ env.TAG }}-*
          path: dist
          merge-multiple: true
      - name: Check archives and create checksums
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            test -s "dist/heapleach_${TAG}_${target}.tar.gz"
          done
          test -s "dist/heapleach_${TAG}_windows_amd64.zip"
          (cd dist && sha256sum ./* > SHA256SUMS)

      # Created as a draft, filled, checked, and only then published.
      # Uploading separately and checking the count prevents an empty public
      # release. Retrying reuses a draft and replaces any partial uploads.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft \
              --title "HeapLeach $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          want=$(find dist -maxdepth 1 -type f | wc -l)
          got=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$got" -ne "$want" ]; then
            echo "::error::release $TAG has $got assets, built $want"
            exit 1
          fi
          gh release edit "$TAG" --draft=false

  # The container image, for every platform the helpers are built for, at
  # ghcr.io/<owner>/heapleach — tagged with the release. It
  # waits for the release job so a tag that fails its tests publishes no
  # image either.
  image:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Embed the exact binaries and OCR data that were published, including
      # their UI and version stamp. Recompiling here discarded the archive job's
      # work and started two cold Go builds because BuildKit cache mounts are local.
      - name: Download and verify the released Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archives=$(mktemp -d)
          trap 'rm -rf "$archives"' EXIT
          gh release download "$TAG" --dir "$archives" \
            --pattern '*_linux_*.tar.gz' --pattern SHA256SUMS
          (cd "$archives" && sha256sum --check --ignore-missing SHA256SUMS)
          for arch in amd64 arm64; do
            mkdir -p "dist/runtime/$arch"
            tar -xzf "$archives/heapleach_${TAG}_linux_${arch}.tar.gz" \
              -C "dist/runtime/$arch" ./heapleach ./ocr
          done
          reported_version=$(dist/runtime/amd64/heapleach -version 2>&1)
          test "$reported_version" = "heapleach $TAG"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Registry names must be lower case; the owner may not be.
      #
      # Every release image carries its own version, in both
      # spellings: v1.2.3 matches the git tag and the release, 1.2.3 is the
      # Docker convention. The minor tags (v1.2, 1.2) follow the newest patch.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/heapleach
          # Only main's image publisher owns latest.
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.TAG }}
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: BINARY_STAGE=released-binary
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max
