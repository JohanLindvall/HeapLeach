name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tested-sha:
        description: Commit that passed the caller's checks; empty for standalone tags
        type: string
        default: ''

# Tag allocation and publication share a queue. Another successful main
# push must neither take the same version nor cancel a half-published one.
concurrency:
  group: heapleach-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        name: Select the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(bash .github/scripts/release-tag.sh "$GITHUB_SHA")
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # The build stamps the version from the tag, but a shallow clone
          # leaves `git describe` blind, which is what every other build here
          # uses.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      # setup-go's immutable go.sum cache was shared with CI, so the release
      # never saved its cross-platform build output. Keep a separate cache
      # that advances with each commit and restores the previous build.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-release-go-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-go-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-

      # Main has already passed the race/coverage suite in this very run.
      # Only that exact checkout may reuse the result; manual tags still test.
      - name: Verify the tested commit
        if: inputs.tested-sha != ''
        env:
          TESTED_SHA: ${{ inputs.tested-sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Test
        if: inputs.tested-sha == ''
        working-directory: backend
        run: go test ./... -count=1

      # One Linux runner builds all of them: the program is pure Go with cgo
      # off, so the targets differ only by GOOS and GOARCH.
      - name: Build the archives
        run: make dist VERSION="$TAG"

      # Created as a draft, filled, checked, and only then published.
      #
      # `gh release create` with the assets on the same line creates the
      # release first and uploads second, and v1.2.42 came out of it public,
      # "successful", and with nothing attached — a release page for a
      # download that did not exist. So the upload is its own step, the
      # count is checked against what was built, and nobody sees the release
      # until it is whole. Every step is safe to repeat: an existing draft is
      # reused and uploads overwrite, so re-running a failed run finishes the
      # job instead of tripping over the half it already did.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --title "HeapLeach $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
          want=$(find dist -maxdepth 1 -type f | wc -l)
          got=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$got" -ne "$want" ]; then
            echo "::error::release $TAG has $got assets, built $want"
            exit 1
          fi
          gh release edit "$TAG" --draft=false

  # The container image, for every platform the helpers are built for, at
  # ghcr.io/<owner>/heapleach — tagged with the release and as latest. It
  # waits for the release job so a tag that fails its tests publishes no
  # image either.
  image:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Embed the exact binaries that were published, including their UI and
      # version stamp. Recompiling here discarded the archive job's work and
      # started two cold Go builds because BuildKit cache mounts are local.
      - name: Download and verify the released Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archives=$(mktemp -d)
          trap 'rm -rf "$archives"' EXIT
          gh release download "$TAG" --dir "$archives" \
            --pattern '*_linux_*.tar.gz' --pattern SHA256SUMS
          (cd "$archives" && sha256sum --check --ignore-missing SHA256SUMS)
          for arch in amd64 arm64; do
            mkdir -p "dist/runtime/$arch"
            tar -xzf "$archives/heapleach_${TAG}_linux_${arch}.tar.gz" \
              -C "dist/runtime/$arch" ./heapleach
          done
          reported_version=$(dist/runtime/amd64/heapleach -version 2>&1)
          test "$reported_version" = "heapleach $TAG"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Registry names must be lower case; the owner may not be.
      #
      # Every image carries its own version as well as latest, in both
      # spellings: v1.2.3 matches the git tag and the release, 1.2.3 is the
      # Docker convention. The minor tags (v1.2, 1.2) follow the newest patch.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/heapleach
          tags: |
            type=semver,pattern=v{{version}},value=${{ env.TAG }}
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: BINARY_STAGE=released-binary
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
